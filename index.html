<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>党课题库</title>
<style>
:root{--fg:#1f2328;--muted:#6b7280;--line:#e5e7eb;--bg:#fff;--accent:#b3261e;--chip:#f3f4f6}
*{box-sizing:border-box}
body{margin:0;font:16px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg)}
header{padding:20px 16px 8px;max-width:880px;margin:0 auto}
h1{margin:0 0 6px;font-size:22px}
.stats{color:var(--muted);font-size:13px;margin-bottom:10px}
#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:15px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;max-width:880px;margin:0 auto;position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);z-index:5;border-bottom:1px solid var(--line)}
nav button{border:1px solid var(--line);background:#fff;color:var(--fg);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer}
nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:880px;margin:0 auto;padding:8px 16px 60px}
.era{margin:22px 0 8px;font-size:13px;color:var(--muted);border-bottom:1px dashed var(--line);padding-bottom:4px;font-weight:600}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0}
.card .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.badge{background:var(--chip);border-radius:6px;padding:1px 7px;color:#374151}
.badge.muted{color:#9ca3af;background:#fafafa}
.stem{margin:8px 0 10px;font-weight:600}
.opts{margin:0 0 10px;padding-left:0;list-style:none}
.opts li{margin:2px 0;color:#374151}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
details[open] summary{margin-bottom:6px}
.answer{font-weight:600;margin:6px 0}
.explain{color:#374151;white-space:pre-wrap;margin:6px 0}
.concept-def{color:#374151;white-space:pre-wrap;margin:8px 0;padding:8px 12px;background:#fafafa;border-left:3px solid var(--accent);border-radius:4px}
.note{color:var(--muted);font-size:13px;margin:4px 0}
.mark{margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer}
.mark.on{background:#fef2f2;border-color:#fca5a5;color:#b3261e}
footer{max-width:880px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12px;line-height:1.6}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.lesson-index{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;margin:6px 0 0}
.lesson-item{display:flex;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
.lesson-item:hover{border-color:var(--accent);box-shadow:0 1px 6px rgba(179,38,30,.08)}
.lesson-no{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:12px;color:#374151;white-space:nowrap}
.lesson-title{flex:1;font-weight:600;font-size:15px}
.lesson-count{color:var(--muted);font-size:12px;white-space:nowrap}
.lesson-arrow{color:#c4c8cf;font-size:18px}
.lesson-item.empty{border-style:dashed}
.lesson-item.empty .lesson-title{color:#9ca3af;font-weight:500}
.lesson-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
.lesson-bar h2{font-size:17px;margin:0;flex:1;min-width:220px}
.back{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
.back:hover{border-color:var(--accent);color:var(--accent)}
.lesson-total{color:var(--muted);font-size:13px}
.history-intro{color:var(--muted);font-size:13px;margin:10px 0 2px}
.facts{margin:8px 0 10px;display:grid;gap:6px}
.facts>div{display:grid;grid-template-columns:42px 1fr;gap:10px}
.facts dt{color:var(--muted);font-size:13px;line-height:1.7;white-space:nowrap}
.facts dd{margin:0}
.fact-main dd{font-weight:600}
.impact{margin:10px 0 0;padding:8px 12px;background:#fafafa;border-left:3px solid var(--accent);border-radius:4px;color:#374151;white-space:pre-wrap}
.impact-label{font-weight:600;color:var(--accent);margin-right:8px}
.chapter-nav{margin:10px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fafafa}
.chapter-nav-title{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:8px}
.chapter-links{display:flex;flex-wrap:wrap;gap:7px}
.chapter-link{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--fg);text-decoration:none;font-size:13px}
.chapter-link:hover{border-color:var(--accent);color:var(--accent)}
.chapter-link span{min-width:20px;text-align:center;padding:0 5px;border-radius:999px;background:var(--chip);color:var(--muted);font-size:12px}
.chapter-link.disabled{opacity:.45}
.chapter-count{margin-left:8px;color:var(--muted);font-size:12px;font-weight:400}
.era{scroll-margin-top:92px}</style>
</head>
<body>
<header>
  <h1>党课题库</h1>
  <div class="stats" id="stats">加载中…</div>
  <input id="q" type="search" placeholder="搜索题干 / 答案 / 解析 / 概念 / 党史 / 关键词">
</header>
<nav id="tabs">
  <button data-view="single">单选题</button>
  <button data-view="multiple">多选题</button>
  <button data-view="blank">填空题</button>
  <button data-view="judge">判断题</button>
  <button data-view="concept">概念</button>
  <button data-view="history">党史</button>
  <button data-view="timeline">时间轴</button>
  <button data-view="review">待复习</button>
</nav>
<main id="list"></main>
<footer><span id="sets"></span></footer>
<script src="assets/app.js?v=20261121alltime"></script>
</body>
</html>
